# golden cases：12 类 × 3 级复杂度 抽样（docs/spec/router-v1.md §9）
# - category: 期望类别（与 data/categories.yaml 一致）
# - complexity: 期望复杂度（仅当无歧义时标注）
# - rule_testable: true = 关键词明确，离线规则兜底测试可断言；false = 留给在线分类评测（backlog）
# - note: 场景说明
cases:
  # ---- 程序编码 ----
  - id: prog-low
    prompt: 帮我写一个Python函数把JSON字符串解析成字典
    category: 程序编码
    complexity: 低
    rule_testable: true
    note: 编码-低
  - id: prog-mid
    prompt: 用Go实现一个带过期时间的LRU缓存
    category: 程序编码
    complexity: 中
    rule_testable: true
    note: 编码-中
  - id: prog-high
    prompt: 设计并实现一个分布式任务调度器的核心调度算法，支持优先级与失败重试
    category: 程序编码
    complexity: 高
    rule_testable: true
    note: 编码-高
  # ---- 前端UX设计 ----
  - id: fe-low
    prompt: 做一个居中登录页的HTML和CSS
    category: 前端UX设计
    complexity: 低
    rule_testable: true
    note: 前端-低
  - id: fe-mid
    prompt: 给这个表格组件加上hover高亮和排序交互
    category: 前端UX设计
    complexity: 中
    rule_testable: true
    note: 前端-中
  - id: fe-high
    prompt: 设计一套多端适配的设计系统，包含色彩、间距、组件状态规范
    category: 前端UX设计
    complexity: 高
    rule_testable: false
    note: 前端-高
  # ---- 文书撰写 ----
  - id: doc-low
    prompt: 帮我写一份本周工作周报
    category: 文书撰写
    complexity: 低
    rule_testable: true
    note: 文书-低
  - id: doc-mid
    prompt: 起草一份跨部门协作的会议纪要模板
    category: 文书撰写
    complexity: 中
    rule_testable: true
    note: 文书-中
  - id: doc-high
    prompt: 撰写一份完整的项目立项报告，含背景、目标、预算与风险章节
    category: 文书撰写
    complexity: 高
    rule_testable: true
    note: 文书-高
  # ---- 数据分析 ----
  - id: da-low
    prompt: 用SQL统计每天订单数量
    category: 数据分析
    complexity: 低
    rule_testable: true
    note: 数据-低
  - id: da-mid
    prompt: 分析这份销售数据，找出增长最快的品类并给出图表
    category: 数据分析
    complexity: 中
    rule_testable: true
    note: 数据-中
  - id: da-high
    prompt: 搭建一个多指标的流失分析框架，含漏斗、留存与AB实验解读
    category: 数据分析
    complexity: 高
    rule_testable: false
    note: 数据-高
  # ---- 数学推理 ----
  - id: math-low
    prompt: 计算 3x+5=17 中 x 的值
    category: 数学推理
    complexity: 低
    rule_testable: true
    note: 数学-低
  - id: math-mid
    prompt: 求解这个不定积分 ∫x·e^x dx
    category: 数学推理
    complexity: 中
    rule_testable: true
    note: 数学-中
  - id: math-high
    prompt: 证明费马小定理并讨论其应用条件
    category: 数学推理
    complexity: 高
    rule_testable: true
    note: 数学-高
  # ---- Agent编排 ----
  - id: agent-low
    prompt: 帮我规划一个两步的数据抓取流程
    category: Agent编排
    complexity: 低
    rule_testable: true
    note: Agent-低
  - id: agent-mid
    prompt: 把这个爬虫任务拆成三个子agent并行执行
    category: Agent编排
    complexity: 中
    rule_testable: true
    note: Agent-中
  - id: agent-high
    prompt: 设计一个多智能体协作系统：规划、执行、质检三层，含工具调用链与异常回收
    category: Agent编排
    complexity: 高
    rule_testable: false
    note: Agent-高
  # ---- 长文档处理 ----
  - id: ld-low
    prompt: 给这篇三页的报告写个摘要
    category: 长文档处理
    complexity: 低
    rule_testable: false
    note: 长文-低（"报告+摘要"在规则层与文书撰写歧义，交 LLM 判类）
  - id: ld-mid
    prompt: 提取这份20页合同里的所有条款清单
    category: 长文档处理
    complexity: 中
    rule_testable: false
    note: 长文-中（"合同+条款"在规则层与文书撰写歧义，交 LLM 判类）
  - id: ld-high
    prompt: 对这篇50页论文做结构化精读：研究问题、方法、证据链与局限
    category: 长文档处理
    complexity: 高
    rule_testable: true
    note: 长文-高
  # ---- 翻译润色 ----
  - id: tr-low
    prompt: 把这句话翻译成英文
    category: 翻译润色
    complexity: 低
    rule_testable: true
    note: 翻译-低
  - id: tr-mid
    prompt: 帮我润色这段英文邮件的语气
    category: 翻译润色
    complexity: 中
    rule_testable: true
    note: 翻译-中
  - id: tr-high
    prompt: 翻译并统一全文术语，输出中英对照的审校稿
    category: 翻译润色
    complexity: 高
    rule_testable: false
    note: 翻译-高
  # ---- 多模态理解 ----
  - id: mm-low
    prompt: 识别这张图片里的文字
    category: 多模态理解
    complexity: 低
    rule_testable: true
    note: 多模态-低
  - id: mm-mid
    prompt: 描述这张产品图的内容并指出瑕疵
    category: 多模态理解
    complexity: 中
    rule_testable: true
    note: 多模态-中
  - id: mm-high
    prompt: 结合图表与实验照片，分析这个实验流程的完整逻辑链
    category: 多模态理解
    complexity: 高
    rule_testable: false
    note: 多模态-高
  # ---- 知识问答/检索 ----
  - id: qa-low
    prompt: 什么是贝叶斯定理
    category: 知识问答/检索
    complexity: 低
    rule_testable: true
    note: 问答-低
  - id: qa-mid
    prompt: 量子计算和经典计算在原理上的区别是什么
    category: 知识问答/检索
    complexity: 中
    rule_testable: true
    note: 问答-中
  - id: qa-high
    prompt: 梳理2024年以来大模型对齐研究的主要路线并给出关键论文脉络
    category: 知识问答/检索
    complexity: 高
    rule_testable: false
    note: 问答-高
  # ---- 创意生成 ----
  - id: cr-low
    prompt: 给新开的奶茶店起5个名字
    category: 创意生成
    complexity: 低
    rule_testable: true
    note: 创意-低
  - id: cr-mid
    prompt: 为这款洗发水新品写三条不同风格的广告语
    category: 创意生成
    complexity: 中
    rule_testable: true
    note: 创意-中
  - id: cr-high
    prompt: 为一季度营销战役做完整的创意概念与内容矩阵提案
    category: 创意生成
    complexity: 高
    rule_testable: false
    note: 创意-高
  # ---- 代码审查与调试 ----
  - id: crv-low
    prompt: 这段代码为什么报错
    category: 代码审查与调试
    complexity: 低
    rule_testable: true
    note: 审查-低
  - id: crv-mid
    prompt: 审查这个PR的代码质量并指出可改进点
    category: 代码审查与调试
    complexity: 中
    rule_testable: true
    note: 审查-中
  - id: crv-high
    prompt: 对一个高并发服务做代码审查：并发安全、性能瓶颈与补测试方案
    category: 代码审查与调试
    complexity: 高
    rule_testable: false
    note: 审查-高
