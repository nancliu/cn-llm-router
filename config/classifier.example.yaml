# 分类器配置样例（docs/spec/router-v1.md §4，ADR-0002）
# 复制为 config/classifier.yaml 后按需修改；默认内置：Qwen3.8-Max-0902 → DeepSeek-V4.1-Flash-CED → 豆包Seed-2.1-Pro
# 评测结论 2026-09-24（180 golden cases，火山 coding-plan / 百炼 token-plan 实测）：
#   Qwen3.8-Max-0902 端到端 99.4% 最优（179/180，耗时最长）
#   DeepSeek-V4.1-Flash-CED 98.9% 且快约 6 倍（316s vs 1922s）→ 成本/速度敏感时优先
#   豆包Seed-2.1-Pro 98.9%（0 错判，复杂度命中 79.6%）
classifier:
  models:
    - Qwen3.8-Max-0902
    - DeepSeek-V4.1-Flash-CED
    - 豆包Seed-2.1-Pro
  timeout: 30
  # 分类输出 token 上限（2026-09-29 提速：默认 256，分类输出仅短 JSON；
  # 推理型模型思考链长需更大空间，按模型覆盖）
  max_tokens: 256
  max_tokens_map:
    DeepSeek-V4.1-Flash-CED: 1024
  # 双模型分类（方案 A，2026-09-29）：prompt 命中视觉信号走主链，纯文本走快速链
  text_chain:
    - DeepSeek-V4.1-Flash-CED
    - Qwen3.8-Max-0902
    - 豆包Seed-2.1-Pro
  multimodal_keywords:
    - 图片
    - 图像
    - 截图
    - 照片
    - 看图
    - 这张图
    - 识别图中
    - 识别图片
    - 图片内容
    - ocr
    - 多模态
    - 设计稿
    - 海报
    - logo
    - 标志
    - banner
    - 横幅
    - 头像
    - 插画
    - 配图
    - 示意图
    - 流程图
    - 架构图
    - 界面图
    - 页面截图
    - 产品图
    - 实物图
    - 视频画面
    - 视频里的
    - 视觉设计
    - 画布
