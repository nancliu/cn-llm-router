# litellm proxy config (Claude Code -> cn-llm-router serve, see ADR-0021)
#
# Purpose: Claude Code only speaks Anthropic Messages format. This config lets
# litellm proxy translate /v1/messages requests into OpenAI chat format and
# forward them to the cn-llm-router serve gateway, which classifies the request
# and transparently routes to CN models (Qwen / CED / GLM ...).
#
# NOTE: keep this file pure ASCII (English comments only). litellm reads the
# config file with the system default encoding (GBK on zh-CN Windows), so
# non-ASCII bytes (UTF-8 Chinese comments) crash startup with
# UnicodeDecodeError 'gbk'. serve.py reads its own YAML with explicit utf-8,
# which is why providers.yaml can keep Chinese comments.
#
# Start:
#   cn-llm-router serve --port 10041            # router gateway first
#   litellm --config config/litellm-proxy.example.yaml --port 4000
# Claude Code side:
#   export ANTHROPIC_BASE_URL=http://127.0.0.1:4000
#   export ANTHROPIC_AUTH_TOKEN=<litellm master_key>
#   export ANTHROPIC_MODEL=router-auto          # or router-qwen (named passthrough)
#   export ANTHROPIC_SMALL_FAST_MODEL=router-auto
#   claude
#
# model_name semantics (passed through to serve as the model argument):
#   router-auto  -> model=auto  classify-and-route per request (cache 1h)
#   router-qwen  -> model=Qwen3.8-Max-0902  named passthrough + same-category backup
#
# Note: api_key is a placeholder (any non-empty value works while serve has no
# --token); if serve enables a token, use the same token here.

master_key: sk-router-bridge            # Claude Code uses this as ANTHROPIC_AUTH_TOKEN

model_list:
  - model_name: router-auto
    litellm_params:
      model: openai/auto
      api_base: http://127.0.0.1:10041/v1
      api_key: sk-router-bridge
      timeout: 120

  - model_name: router-qwen
    litellm_params:
      model: openai/Qwen3.8-Max-0902
      api_base: http://127.0.0.1:10041/v1
      api_key: sk-router-bridge
      timeout: 120

  - model_name: router-ced
    litellm_params:
      model: openai/DeepSeek-V4.1-Flash-CED
      api_base: http://127.0.0.1:10041/v1
      api_key: sk-router-bridge
      timeout: 120

litellm_settings:
  drop_params: true          # silently drop unsupported params (e.g. cache_control)
  num_retries: 0             # no retry at translation layer (serve/RouterClient handles failover)
